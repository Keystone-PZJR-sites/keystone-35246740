name: Preview Deploy (website-mod branches)

# Uploads a new Worker *version* (without deploying it to production traffic)
# for every push to a website-mod PR branch. Cloudflare serves the version at
# https://<version-prefix>-<worker>.<subdomain>.workers.dev, which is a fully
# navigable preview of the branch (links, assets, and sub-pages all work).
#
# The version message + tag embed branch + commit SHA so sor-service can find the
# matching version via the Workers Versions API and surface the preview URL.

on:
  push:
    branches:
      - 'website-mod-**'

jobs:
  preview:
    runs-on: ubuntu-latest
    name: Upload preview version
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with OpenNext
        run: npx opennextjs-cloudflare build
        env:
          API_URL: ${{ secrets.API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          AUTH_API_URL: ${{ secrets.AUTH_API_URL }}

      - name: Upload Worker version (preview)
        id: upload
        run: |
          set -euo pipefail
          output="$(
            npx wrangler versions upload \
              --name "${{ github.event.repository.name }}" \
              --message "preview ${{ github.ref_name }} ${{ github.sha }}" \
              --tag "preview-${{ github.sha }}" \
              2>&1 | tee /dev/stderr
          )"
          preview_url="$(
            echo "$output" \
              | sed -n 's/.*Version Preview URL:[[:space:]]*\(https[^[:space:]]*\).*/\1/p' \
              | head -1
          )"
          if [ -z "$preview_url" ]; then
            preview_url="$(
              echo "$output" \
                | grep -oE 'https://[a-f0-9-]+-[^[:space:]]+\.workers\.dev' \
                | head -1
            )"
          fi
          if [ -z "$preview_url" ]; then
            echo "Could not parse Version Preview URL from wrangler output" >&2
            exit 1
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test preview URL
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.preview_url }}
        run: |
          set -euo pipefail
          code="$(
            curl -sS -o /tmp/preview-body.txt -w '%{http_code}' \
              --max-time 30 \
              "${PREVIEW_URL%/}/"
          )"
          echo "Preview HTTP status: $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            head -c 2000 /tmp/preview-body.txt || true
            exit 1
          fi
          if grep -qi 'Internal Server Error' /tmp/preview-body.txt; then
            head -c 2000 /tmp/preview-body.txt || true
            exit 1
          fi
